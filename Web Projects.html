<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
    <meta charset="utf-8">
    <title>Web Projects</title>
    <link rel="stylesheet" href="/CSS/styles.css">
    <link rel="stylesheet" href="/CSS/robot-styles.css">
    <link rel="stylesheet" href="/CSS/checkout-styles.css">
    </head>
    
    <body class="showcase">
        <div class="web-project">
            <h1>Animated Robot</h1>
            <div class="robot-container">
                <div class="robot-face-shape">
                    <div class="robot-eye-left"></div>
                    <div class="robot-eye-right"></div>
                    <div class="robot-nose"></div>
                    <div class="robot-teeth">
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                        <div class="robot-tooth"></div>
                    </div>
                </div>
                <div class="robot-ear-left"></div>
                <div class="robot-ear-right"></div>
                <div class="robot-hair-style">
                    <div class="robot-hair-one"></div>
                    <div class="robot-hair-two"></div>
                    <div class="robot-hair-three"></div>
                    <div class="robot-hair-two"></div>
                    <div class="robot-hair-one"></div>
                </div>
            </div>
        </div>

        <div class="web-project">
            <h1>Checkout Page</h1>
            <div class="content">
                <main>
                    <form class="forms">
                    <div class="layout-column">
                        <!-- ORDER SUMMARY BOX -->
                        <div class="box order-summary">
                        <h2>Order summary</h2>
                        <div class="order-options">
                            <div class="form-options-group-item">
                            <input
                                type="radio"
                                id="travelPack"
                                name="orderItem"
                                checked
                            />
                            <label for="travelPack" class="fancy-label">
                                <span class="label-content-wrapper">
                                <span class="option-item-name">
                                    <span class="name">Travel pack</span>
                                    <span class="hint">10 presets</span>
                                </span>
                                <span class="option-item-selected">
                                    <span class="price">18.00</span>
                                    <span class="circle"></span>
                                </span>
                                </span>
                            </label>
                            </div>
                            <div class="form-options-group-item">
                            <input type="radio" id="travelPackArtPack" name="orderItem" />
                            <label for="travelPackArtPack">
                                <span class="label-content-wrapper">
                                <span class="option-item-name">
                                    <span class="name">Travel + Art Pack</span>
                                    <span class="hint">20 presets</span>
                                </span>
                                <span class="option-item-selected">
                                    <span class="price">18.00</span>
                                    <span class="circle"></span>
                                </span>
                                </span>
                            </label>
                            </div>
                            <div class="form-options-group-item">
                            <input
                                type="radio"
                                id="travelPackArtPackPortraitPack"
                                name="orderItem"
                            />
                            <label for="travelPackArtPackPortraitPack">
                                <span class="label-content-wrapper">
                                <span class="option-item-name">
                                    <span class="name">Travel + Art + Portrait Pack</span>
                                    <span class="hint">30 presets</span>
                                </span>
                                <span class="option-item-selected">
                                    <span class="price">18.00</span>
                                    <span class="circle"></span>
                                </span>
                                </span>
                            </label>
                            </div>
                        </div>
                        </div>
                        <!-- REVIEWS BOX -->
                        <div class="box reviews">
                        <div class="image-wrapper">
                            <img src="./assets/avatars/user-image.jpeg" alt="" />
                        </div>
                        <div class="review-details">
                            <div class="review-author-info">
                            <div class="review-author-name">
                                <span class="name">Gustavo Dias</span>
                                <span class="hint">Happy Customer</span>
                            </div>
                            <div class="stars">
                                <i class="fa fa-star"></i>
                                <i class="fa fa-star"></i>
                                <i class="fa fa-star"></i>
                                <i class="fa fa-star"></i>
                                <i class="fa fa-star"></i>
                            </div>
                            </div>
                            <p class="review-text">
                            Definitely an amazing package. It helps cultivate creativity
                            and encourages you to shoot differently than you normally
                            would
                            </p>
                        </div>
                        </div>
                    </div>
                    <div class="layout-column">
                        <!-- PAYMENT DETAILS BOX -->

                        <div class="box payment">
                        <h2>Payment details</h2>
                        <div class="payment-options horizontal">
                            <div class="form-options-group-item">
                            <input
                                type="radio"
                                id="pay-by-card"
                                name="paymentItem"
                                checked
                            />
                            <label for="pay-by-card" class="fancy-label">
                                <span class="label-content-wrapper">
                                <span class="option-item-name horizontal small-gap">
                                    <i class="fa fa-credit-card"></i>
                                    <span class="name">pay by card</span>
                                    <!-- <span class="hint">10 presets</span> -->
                                </span>
                                <span class="option-item-selected">
                                    <!-- <span class="price">18.00</span> -->
                                    <span class="circle"></span>
                                </span>
                                </span>
                            </label>
                            </div>
                            <div class="form-options-group-item">
                            <input type="radio" id="pay-with-paypal" name="paymentItem" />
                            <label for="pay-with-paypal" class="fancy-label">
                                <span class="label-content-wrapper">
                                <span class="option-item-name horizontal small-gap">
                                    <i class="fa fa-paypal"></i>
                                    <span class="name">pay with paypal</span>
                                    <!-- <span class="hint">10 presets</span> -->
                                </span>
                                <span class="option-item-selected">
                                    <!-- <span class="price">18.00</span> -->
                                    <span class="circle"></span>
                                </span>
                                </span>
                            </label>
                            </div>
                        </div>
                        <div class="form-input-group">
                            <label for="card-number">Card number</label>
                            <img src="./assets/logos/ma_symbol.svg" alt="" />
                            <input
                            id="card-number"
                            type="text"
                            value="1234 4567 7890 4554"
                            />
                        </div>

                        <div class="form-control">
                            <div class="form-input-group">
                            <label for="expire">Expiration date</label>
                            <input id="expire" type="text" value="05/24" />
                            </div>
                            <div class="form-input-group">
                            <label for="securecode">CVV</label>
                            <input
                                id="securecode"
                                type="password"
                                maxlength="3"
                                value="444"
                            />
                            </div>
                        </div>
                        <div class="form-input-group">
                            <label for="holder-name">Card holder name</label>
                            <input
                            id="holder-name"
                            type="text"
                            value="Somebody Somebodyvich"
                            />
                        </div>
                        <div class="save-card-policy">
                            <input id="save-card" type="checkbox" />
                            <label for="save-card"
                            >Save this card for future payments</label
                            >
                        </div>
                        <hr />
                        <div class="order-table">
                            <div class="item">
                            <div class="label">Subtotal</div>
                            <div class="value">32.00</div>
                            </div>
                            <div class="item">
                            <div class="label">Vat (20%)</div>
                            <div class="value">6.40</div>
                            </div>
                            <div class="item total">
                            <div class="label">total</div>
                            <div id="value" class="value">38.40</div>
                            </div>
                        </div>
                        <input type="submit" value="Pay $38.40" />
                        <div class="security-label">
                            <div class="secure-icon">
                            <i class="fa fa-shield"></i>
                            </div>
                            <span>Payments are secured and encrypted</span>
                        </div>
                        </div>
                    </div>
                    </form>
                </main>
            </div>
        </div>
    </body>

</html>
